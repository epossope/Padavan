<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0A0A0A"><title>Noema</title>
<script>
/* ES5 pre-boot owner. It must remain independent of every application asset. */
(function () {
  var APP_BUILD_ID='__NOEMA_APP_BUILD_ID__', BOOT_TIMEOUT_MS=10000, SDK_TIMEOUT_MS=3500;
  var ASSETS=['tokens.js','ui.js','orb.js','app.js','screens.js','mobile.js','voice-conversation.js'];
  var seen={}, bootstrap=null, active=false, finished=false, watchdog=0, activeController=null;
  function telegram(){try{return window.Telegram&&window.Telegram.WebApp||null}catch(_){return null}}
  function rawInitData(){var source=(location.search||'')+'&'+(location.hash||''), match=source.match(/[?&#]tgWebAppData=([^&#]*)/);try{return match?decodeURIComponent(match[1].replace(/\+/g,'%20')):''}catch(_){return ''}}
  function code(value){return String(value&& (value.code||value.name) || 'BOOT_FAILED').replace(/[^A-Z0-9_:-]/gi,'_').slice(0,80)}
  function details(){var sdk=telegram();return {app_version:APP_BUILD_ID,platform:String(sdk&&sdk.platform||'unknown').slice(0,40),telegram_version:String(sdk&&sdk.version||'').slice(0,40),boot_id:bootId}}
  function emit(stage,extra){var event=details(), key; event.stage=stage; extra=extra||{};for(key in extra)if(Object.prototype.hasOwnProperty.call(extra,key))event[key]=extra[key];window.NoemaBootEvents=window.NoemaBootEvents||[];window.NoemaBootEvents.push(event);if(window.NoemaBootEvents.length>80)window.NoemaBootEvents.shift();if(window.fetch){try{window.fetch('/api/v1/miniapp/boot-telemetry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(event)}).catch(function(){})}catch(_){}}return event}
  function errorFor(value){var error=new Error(value);error.code=value;return error}
  function messageFor(value){return value==='SESSION_EXPIRED'||value==='AUTH_FAILED'?'Сессия Telegram устарела. Закройте и снова откройте Noema.':value==='TELEGRAM_UNAVAILABLE'||value==='INITDATA_MISSING'?'Не удалось подключиться к Telegram. Закройте и снова откройте Noema.':'Не удалось загрузить Noema'}
  function recovery(value){var splash=document.getElementById('splash'), screen=document.getElementById('boot-recovery'), message;if(finished&&value!=='BUILD_MISMATCH')return;finished=true;window.clearTimeout(watchdog);if(activeController&&activeController.abort)activeController.abort();if(splash)splash.className=(splash.className+' hidden').replace(/^\s+|\s+$/g,'');if(screen){screen.hidden=false;message=screen.querySelector('[data-boot-message]');if(message)message.textContent=messageFor(value)}emit(value==='BOOT_TIMEOUT'?'boot_timeout':'bootstrap_failed',{code:code(value)})}
  function isPreview(){return /^(localhost|127\.0\.0\.1|\[::1\])$/i.test(location.hostname)||location.search.indexOf('preview')>=0}
  function controlledReload(){var key='noema-build-reload:'+APP_BUILD_ID, url;if(!window.sessionStorage||sessionStorage.getItem(key)){recovery('BUILD_MISMATCH');return}sessionStorage.setItem(key,'1');url=location.href+(location.search?'&':'?')+'__noema_build='+encodeURIComponent(APP_BUILD_ID);location.replace(url)}
  function loadNext(index){var script, name;if(finished)return;if(index>=ASSETS.length)return;name=ASSETS[index];script=document.createElement('script');script.src='/app/assets/'+name+'?v='+encodeURIComponent(APP_BUILD_ID);script.async=false;script.onload=function(){loadNext(index+1)};script.onerror=function(){recovery('ASSET_LOAD_FAILED')};document.head.appendChild(script)}
  function begin(){if(finished)return;watchdog=window.setTimeout(function(){recovery('BOOT_TIMEOUT')},BOOT_TIMEOUT_MS);emit('boot_started');var sdk=document.createElement('script');sdk.src='https://telegram.org/js/telegram-web-app.js';sdk.async=false;sdk.onerror=function(){emit('sdk_load_failed')};sdk.onload=function(){emit('sdk_loaded')};document.head.appendChild(sdk);loadNext(0)}
  var bootId='boot-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
  window.NoemaBoot={APP_BUILD_ID:APP_BUILD_ID,BOOT_TIMEOUT_MS:BOOT_TIMEOUT_MS,telegram:telegram,initData:function(){var sdk=telegram();return sdk&&sdk.initData||rawInitData()},emit:emit,stage:emit,
    assetReady:function(name,build){seen[name]=build;if(build!==APP_BUILD_ID)controlledReload()},
    waitForTelegram:function(signal){return new Promise(function(resolve,reject){var started=Date.now(), timer=function(){var sdk, raw;if(signal&&signal.aborted)return reject(errorFor('BOOT_TIMEOUT'));if(isPreview()){emit('initdata_present',{present:false,preview:true});return resolve({telegram:null,preview:true})}sdk=telegram();raw=rawInitData();if((sdk&&sdk.initData)||raw){emit(sdk?'telegram_ready':'telegram_fallback');emit('initdata_present',{present:true,fallback:!sdk});return resolve({telegram:sdk||{initData:raw},preview:false})}if(Date.now()-started>=SDK_TIMEOUT_MS){emit('initdata_present',{present:false});return reject(errorFor(sdk?'INITDATA_MISSING':'TELEGRAM_UNAVAILABLE'))}window.setTimeout(timer,50)};timer()})},
    run:function(fn){var controller, timeout, splash, screen;bootstrap=fn;if(active)return;if(finished)finished=false;active=true;splash=document.getElementById('splash');if(splash)splash.className=splash.className.replace(/\bhidden\b/g,'').replace(/^\s+|\s+$/g,'');screen=document.getElementById('boot-recovery');if(screen)screen.hidden=true;controller=window.AbortController?new AbortController():{signal:{aborted:false},abort:function(){this.signal.aborted=true}};activeController=controller;timeout=window.setTimeout(function(){controller.abort();recovery('BOOT_TIMEOUT')},BOOT_TIMEOUT_MS);emit('js_ready');Promise.resolve().then(function(){return fn(controller.signal)}).then(function(){if(controller.signal.aborted)throw errorFor('BOOT_TIMEOUT');finished=true;window.clearTimeout(watchdog);emit('render_ready');var splash=document.getElementById('splash');if(splash)splash.className=(splash.className+' hidden').replace(/^\s+|\s+$/g,'')}).catch(function(error){recovery(controller.signal&&controller.signal.aborted?'BOOT_TIMEOUT':code(error))}).then(function(){window.clearTimeout(timeout);if(activeController===controller)activeController=null;active=false},function(){window.clearTimeout(timeout);if(activeController===controller)activeController=null;active=false})},
    retry:function(){if(bootstrap&&!active){finished=false;this.run(bootstrap)}},reload:function(){location.replace(location.href+(location.search?'&':'?')+'__noema_reload='+Date.now())}
  };
  window.addEventListener('error',function(){if(!finished)recovery('EARLY_JS_ERROR');else emit('window_error')});
  window.addEventListener('unhandledrejection',function(){if(!finished)recovery('EARLY_PROMISE_REJECTION');else emit('unhandledrejection')});
  document.addEventListener('click',function(event){var node=event.target;while(node&&node!==document){if(node.getAttribute&&node.getAttribute('data-boot-retry')!==null)return window.NoemaBoot.retry();if(node.getAttribute&&node.getAttribute('data-boot-reload')!==null)return window.NoemaBoot.reload();node=node.parentNode}});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',begin);else begin();
}());
</script>
<link rel="stylesheet" href="/app/assets/style.css?v=__NOEMA_APP_BUILD_ID__"></head>
<body>
<div id="splash" role="status" aria-label="Загрузка Noema"><canvas class="membrane" width="500" height="500" aria-hidden="true"></canvas><h1>Noema</h1></div>
<section id="boot-recovery" class="boot-recovery" hidden aria-live="polite" style="padding:32px 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;background:#0A0A0A;min-height:100vh"><h1>Не удалось загрузить Noema</h1><p data-boot-message>Не удалось загрузить Noema</p><div><button class="primary" type="button" data-boot-retry>Повторить</button><button class="secondary" type="button" data-boot-reload>Перезагрузить</button></div></section>
<div id="shell"><header id="header"></header><div id="notice" role="status"></div><main id="content"></main><aside id="dock" aria-label="Ассистент"></aside></div>
<dialog id="editor"><form id="edit-form"><div class="form-head"><h2 id="form-title"></h2><button type="button" id="cancel" class="icon" aria-label="Закрыть">×</button></div><div id="fields"></div><button type="submit" class="primary">Сохранить</button></form></dialog>
<dialog id="layout-editor" aria-label="Настроить главный экран"><div class="form-head"><h2>Виджеты</h2><button class="icon" data-close-layout aria-label="Закрыть">×</button></div><p class="subtle">Перетаскивай карточки или меняй порядок стрелками. Скрытие не удаляет данные.</p><div id="layout-items"></div><div class="toolbar"><button class="secondary" data-reset-layout>По умолчанию</button><button class="primary" data-save-layout>Сохранить</button></div></dialog>
<dialog id="archive-preview" class="preview-sheet" aria-label="Просмотр сохранённого"><div class="form-head"><h2 id="preview-title">Просмотр</h2><button class="icon" data-preview-close aria-label="Закрыть">×</button></div><div id="preview-body"></div></dialog>
<link rel="stylesheet" href="/app/assets/mobile.css?v=__NOEMA_APP_BUILD_ID__"><link rel="stylesheet" href="/app/assets/refinement.css?v=__NOEMA_APP_BUILD_ID__"><link rel="stylesheet" href="/app/assets/design-match.css?v=__NOEMA_APP_BUILD_ID__"></body></html>
