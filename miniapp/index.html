<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0A0A0A"><title>Noema</title>
<script>
(()=>{
 const APP_BUILD_ID='__NOEMA_APP_BUILD_ID__',BOOT_TIMEOUT_MS=10000,SDK_TIMEOUT_MS=3500,ASSETS=['tokens.js','ui.js','orb.js','app.js','screens.js','mobile.js','voice-conversation.js'],seen=new Map();
 const localPreview=()=>/^(localhost|127\.0\.0\.1|\[::1\])$/i.test(location.hostname)||new URLSearchParams(location.search).has('preview');
 const telegram=()=>{try{return window.Telegram?.WebApp||null}catch{return null}};
 const detail=()=>{const sdk=telegram();return {app_version:APP_BUILD_ID,platform:String(sdk?.platform||'unknown').slice(0,40),telegram_version:String(sdk?.version||'').slice(0,40)}};
 const safeCode=value=>String(value?.code||value?.name||'BOOT_FAILED').replace(/[^A-Z0-9_:-]/gi,'_').slice(0,80);
 const emit=(stage,extra={})=>{const event={stage,...detail(),...extra};(window.NoemaBootEvents=window.NoemaBootEvents||[]).push(event);if(window.NoemaBootEvents.length>80)window.NoemaBootEvents.shift();fetch('/api/v1/miniapp/boot-telemetry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(event),keepalive:true}).catch(()=>{});return event};
 const errorFor=code=>{const error=new Error(code);error.code=code;return error};
 const messageFor=code=>code==='SESSION_EXPIRED'||code==='AUTH_FAILED'?'Сессия Telegram устарела. Закройте и откройте Noema снова.':code==='TELEGRAM_UNAVAILABLE'||code==='INITDATA_MISSING'?'Не удалось подключиться к Telegram. Закройте и откройте Noema снова.':'Не удалось загрузить Noema';
 const recovery=(code='BOOT_FAILED')=>{const splash=document.querySelector('#splash'),screen=document.querySelector('#boot-recovery');splash?.classList.add('hidden');if(screen){screen.hidden=false;screen.querySelector('[data-boot-message]').textContent=messageFor(code)}emit(code==='BOOT_TIMEOUT'?'boot_timeout':'bootstrap_failed',{code:safeCode(code)});};
 const controlledReload=()=>{const key=`noema-build-reload:${APP_BUILD_ID}`;if(sessionStorage.getItem(key)){recovery('BUILD_MISMATCH');return}sessionStorage.setItem(key,'1');const url=new URL(location.href);url.searchParams.set('__noema_build',APP_BUILD_ID);location.replace(url.toString())};
 let bootstrap=null,active=false;
 window.NoemaBoot={APP_BUILD_ID,BOOT_TIMEOUT_MS,telegram,emit,stage:emit,
  assetReady(name,build){seen.set(name,build);if(build!==APP_BUILD_ID)controlledReload()},
  verifyAssets(){if([...seen.values()].some(build=>build!==APP_BUILD_ID)||ASSETS.some(name=>!seen.has(name)))controlledReload()},
  async waitForTelegram(signal){if(localPreview()){emit('initdata_present',{present:false,preview:true});return {telegram:null,preview:true}}const started=Date.now();while(Date.now()-started<SDK_TIMEOUT_MS){if(signal?.aborted)throw errorFor('BOOT_TIMEOUT');const sdk=telegram();if(sdk?.initData){emit('telegram_ready');emit('initdata_present',{present:true});return {telegram:sdk,preview:false}}await new Promise(resolve=>setTimeout(resolve,50))}emit('initdata_present',{present:false});throw errorFor(telegram()?'INITDATA_MISSING':'TELEGRAM_UNAVAILABLE')},
  async run(fn){bootstrap=fn;if(active)return;active=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort('BOOT_TIMEOUT'),BOOT_TIMEOUT_MS);document.querySelector('#boot-recovery')?.setAttribute('hidden','');document.querySelector('#splash')?.classList.remove('hidden');emit('js_ready');try{await fn(controller.signal);if(controller.signal.aborted)throw errorFor('BOOT_TIMEOUT');emit('render_ready');document.querySelector('#splash')?.classList.add('hidden')}catch(error){recovery(controller.signal.aborted?'BOOT_TIMEOUT':safeCode(error))}finally{clearTimeout(timeout);active=false}},
  retry(){if(!bootstrap||active)return;this.run(bootstrap)},
  reload(){const url=new URL(location.href);url.searchParams.set('__noema_reload',String(Date.now()));location.replace(url.toString())}
 };
 window.addEventListener('error',()=>emit('window_error'));
 window.addEventListener('unhandledrejection',()=>emit('unhandledrejection'));
 document.addEventListener('click',event=>{const button=event.target.closest('[data-boot-retry],[data-boot-reload]');if(!button)return;if(button.hasAttribute('data-boot-retry'))window.NoemaBoot.retry();else window.NoemaBoot.reload()});
 emit('boot_started');setTimeout(()=>window.NoemaBoot.verifyAssets(),6000);
})();
</script>
<link rel="stylesheet" href="/app/assets/style.css?v=__NOEMA_APP_BUILD_ID__"><script src="/app/assets/tokens.js?v=__NOEMA_APP_BUILD_ID__"></script><script src="https://telegram.org/js/telegram-web-app.js"></script></head>
<body>
<div id="splash" role="status" aria-label="Загрузка Noema"><canvas class="membrane" width="500" height="500" aria-hidden="true"></canvas><h1>Noema</h1></div>
<section id="boot-recovery" class="boot-recovery" hidden aria-live="polite"><h1>Не удалось загрузить Noema</h1><p data-boot-message>Не удалось загрузить Noema</p><div><button class="primary" type="button" data-boot-retry>Повторить</button><button class="secondary" type="button" data-boot-reload>Перезагрузить</button></div></section>
<div id="shell"><header id="header"></header><div id="notice" role="status"></div><main id="content"></main><aside id="dock" aria-label="Ассистент"></aside></div>
<dialog id="editor"><form id="edit-form"><div class="form-head"><h2 id="form-title"></h2><button type="button" id="cancel" class="icon" aria-label="Закрыть">×</button></div><div id="fields"></div><button type="submit" class="primary">Сохранить</button></form></dialog>
<dialog id="layout-editor" aria-label="Настроить главный экран"><div class="form-head"><h2>Виджеты</h2><button class="icon" data-close-layout aria-label="Закрыть">×</button></div><p class="subtle">Перетаскивай карточки или меняй порядок стрелками. Скрытие не удаляет данные.</p><div id="layout-items"></div><div class="toolbar"><button class="secondary" data-reset-layout>По умолчанию</button><button class="primary" data-save-layout>Сохранить</button></div></dialog>
<dialog id="archive-preview" class="preview-sheet" aria-label="Просмотр сохранённого"><div class="form-head"><h2 id="preview-title">Просмотр</h2><button class="icon" data-preview-close aria-label="Закрыть">×</button></div><div id="preview-body"></div></dialog>
<link rel="stylesheet" href="/app/assets/mobile.css?v=__NOEMA_APP_BUILD_ID__"><link rel="stylesheet" href="/app/assets/refinement.css?v=__NOEMA_APP_BUILD_ID__"><link rel="stylesheet" href="/app/assets/design-match.css?v=__NOEMA_APP_BUILD_ID__"><script src="/app/assets/ui.js?v=__NOEMA_APP_BUILD_ID__"></script><script src="/app/assets/orb.js?v=__NOEMA_APP_BUILD_ID__"></script><script src="/app/assets/app.js?v=__NOEMA_APP_BUILD_ID__"></script><script src="/app/assets/screens.js?v=__NOEMA_APP_BUILD_ID__"></script><script src="/app/assets/mobile.js?v=__NOEMA_APP_BUILD_ID__"></script><script src="/app/assets/voice-conversation.js?v=__NOEMA_APP_BUILD_ID__"></script></body></html>
