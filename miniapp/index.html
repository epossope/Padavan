<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0A0A0A"><title>Noema</title>
<script>
/* ES5 pre-boot owner. It remains independent of every application asset. */
(function () {
  var APP_BUILD_ID='__NOEMA_APP_BUILD_ID__', BOOT_TIMEOUT_MS=10000, SDK_TIMEOUT_MS=3500;
  var ASSETS=['tokens.js','ui.js','orb.js','app.js','screens.js','mobile.js','voice-conversation.js'];
  var seen={}, bootstrap=null, active=false, finished=false, failed=false, assetsComplete=false, watchdog=0, activeController=null;
  var bootStartedAt=Date.now(), lastBootStage='HTML', failureReported=false;
  window.NoemaBootEvents=window.NoemaBootEvents||[];
  function telegram(){try{return window.Telegram&&window.Telegram.WebApp||null}catch(_){return null}}
  function rawInitData(){var source=(location.search||'')+'&'+(location.hash||''), match=source.match(/[?&#]tgWebAppData=([^&#]*)/);try{return match?decodeURIComponent(match[1].replace(/\+/g,'%20')):''}catch(_){return ''}}
  function code(value){return String(value&&(value.code||value.name)||'BOOT_FAILED').replace(/[^A-Z0-9_:-]/gi,'_').slice(0,80)||'BOOT_FAILED'}
  function platform(){var value=String(telegram()&&telegram().platform||'').toLowerCase();if(value==='ios'||/iphone|ipad|ipod/.test(navigator.userAgent||''))return 'ios';if(value==='android'||/android/.test(navigator.userAgent||''))return 'android';if(value==='tdesktop'||value==='macos'||value==='windows'||value==='weba'||value==='webk')return 'desktop';return value?'web':'unknown'}
  function telegramVersion(){return String(telegram()&&telegram().version||'unknown').replace(/[^A-Za-z0-9._:-]/g,'_').slice(0,80)||'unknown'}
  function stage(value){lastBootStage=value;window.NoemaBootEvents.push({stage:value,last_boot_stage:value});if(window.NoemaBootEvents.length>80)window.NoemaBootEvents.shift();return value}
  function reportFailure(value){var payload;if(failureReported)return;failureReported=true;payload={build_id:APP_BUILD_ID,last_boot_stage:lastBootStage,platform:platform(),telegram_version:telegramVersion(),elapsed_ms:Math.max(0,Math.round(Date.now()-bootStartedAt)),error_code:code(value)};if(window.fetch){try{window.fetch('/api/v1/miniapp/boot-telemetry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true}).catch(function(){})}catch(_){}}}
  function errorFor(value){var error=new Error(value);error.code=value;return error}
  function messageFor(value){return value==='SESSION_EXPIRED'||value==='AUTH_FAILED'?'Сессия Telegram устарела. Закройте и снова откройте Noema.':value==='TELEGRAM_UNAVAILABLE'||value==='INITDATA_MISSING'?'Не удалось подключиться к Telegram. Закройте и снова откройте Noema.':'Не удалось загрузить Noema'}
  function recovery(value){var splash=document.getElementById('splash'),screen=document.getElementById('boot-recovery'),message;if(failed&&value!=='BUILD_MISMATCH')return;failed=true;finished=true;window.clearTimeout(watchdog);if(activeController&&activeController.abort)activeController.abort();if(splash)splash.className=(splash.className+' hidden').replace(/^\s+|\s+$/g,'');if(screen){screen.hidden=false;message=screen.querySelector('[data-boot-message]');if(message)message.textContent=messageFor(value)}reportFailure(value)}
  function isPreview(){return /^(localhost|127\.0\.0\.1|\[::1\])$/i.test(location.hostname)||location.search.indexOf('preview')>=0}
  function controlledReload(){var key='noema-build-reload:'+APP_BUILD_ID,url;if(!window.sessionStorage||sessionStorage.getItem(key)){recovery('BUILD_MISMATCH');return}sessionStorage.setItem(key,'1');url=location.href+(location.search?'&':'?')+'__noema_build='+encodeURIComponent(APP_BUILD_ID);location.replace(url)}
  function loadNext(index){var script,name;if(failed)return;if(index>=ASSETS.length){assetsComplete=true;return}name=ASSETS[index];if(name==='screens.js')stage('SCREENS_INIT');script=document.createElement('script');script.src='/app/assets/'+name+'?v='+encodeURIComponent(APP_BUILD_ID);script.async=false;script.onload=function(){loadNext(index+1)};script.onerror=function(){recovery('ASSET_LOAD_FAILED')};document.head.appendChild(script)}
  function begin(){if(failed)return;stage('ASSETS');watchdog=window.setTimeout(function(){recovery('BOOT_TIMEOUT')},BOOT_TIMEOUT_MS);var sdk=document.createElement('script');sdk.src='https://telegram.org/js/telegram-web-app.js';sdk.async=false;document.head.appendChild(sdk);loadNext(0)}
  window.NoemaBoot={APP_BUILD_ID:APP_BUILD_ID,BOOT_TIMEOUT_MS:BOOT_TIMEOUT_MS,telegram:telegram,initData:function(){var sdk=telegram();return sdk&&sdk.initData||rawInitData()},stage:stage,
    assetReady:function(name,build){seen[name]=build;if(build!==APP_BUILD_ID)controlledReload()},
    waitForTelegram:function(signal){return new Promise(function(resolve,reject){var started=Date.now(),timer;stage('TG_DATA');timer=function(){var sdk,raw;if(signal&&signal.aborted)return reject(errorFor('BOOT_TIMEOUT'));if(isPreview())return resolve({telegram:null,preview:true});sdk=telegram();raw=rawInitData();if((sdk&&sdk.initData)||raw)return resolve({telegram:sdk||{initData:raw},preview:false});if(Date.now()-started>=SDK_TIMEOUT_MS)return reject(errorFor(sdk?'INITDATA_MISSING':'TELEGRAM_UNAVAILABLE'));window.setTimeout(timer,50)};timer()})},
    run:function(fn){var controller,timeout,splash,screen;bootstrap=fn;if(active)return;if(finished){finished=false;failed=false;failureReported=false;bootStartedAt=Date.now()}active=true;splash=document.getElementById('splash');if(splash)splash.className=splash.className.replace(/\bhidden\b/g,'').replace(/^\s+|\s+$/g,'');screen=document.getElementById('boot-recovery');if(screen)screen.hidden=true;controller=window.AbortController?new AbortController():{signal:{aborted:false},abort:function(){this.signal.aborted=true}};activeController=controller;timeout=window.setTimeout(function(){controller.abort();recovery('BOOT_TIMEOUT')},BOOT_TIMEOUT_MS);stage('SCREENS_INIT');Promise.resolve().then(function(){return fn(controller.signal)}).then(function(){if(controller.signal.aborted)throw errorFor('BOOT_TIMEOUT');finished=true;window.clearTimeout(watchdog);stage('APP_READY');var splash=document.getElementById('splash');if(splash)splash.className=(splash.className+' hidden').replace(/^\s+|\s+$/g,'')}).catch(function(error){recovery(controller.signal&&controller.signal.aborted?'BOOT_TIMEOUT':code(error))}).then(function(){window.clearTimeout(timeout);if(activeController===controller)activeController=null;active=false},function(){window.clearTimeout(timeout);if(activeController===controller)activeController=null;active=false})},
    retry:function(){if(failed&&!assetsComplete)return this.reload();if(bootstrap&&!active){finished=false;failed=false;failureReported=false;bootStartedAt=Date.now();this.run(bootstrap)}},reload:function(){location.replace(location.href+(location.search?'&':'?')+'__noema_reload='+Date.now())}
  };
  window.addEventListener('error',function(){if(!finished||!assetsComplete)recovery('EARLY_JS_ERROR')});
  window.addEventListener('unhandledrejection',function(){if(!finished||!assetsComplete)recovery('EARLY_PROMISE_REJECTION')});
  document.addEventListener('click',function(event){var node=event.target;while(node&&node!==document){if(node.getAttribute&&node.getAttribute('data-boot-retry')!==null)return window.NoemaBoot.retry();if(node.getAttribute&&node.getAttribute('data-boot-reload')!==null)return window.NoemaBoot.reload();node=node.parentNode}});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',begin);else begin();
}());
</script>
<link rel="stylesheet" href="/app/assets/style.css?v=__NOEMA_APP_BUILD_ID__"></head>
<body>
<div id="splash" role="status" aria-label="Загрузка Noema"><canvas class="membrane" width="500" height="500" aria-hidden="true"></canvas><h1>Noema</h1></div>
<section id="boot-recovery" class="boot-recovery" hidden aria-live="polite" style="padding:32px 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;background:#0A0A0A;min-height:100vh"><h1>Не удалось загрузить Noema</h1><p data-boot-message>Не удалось загрузить Noema</p><div><button class="primary" type="button" data-boot-retry>Повторить</button><button class="secondary" type="button" data-boot-reload>Перезагрузить</button></div></section>
<div id="shell"><header id="header"></header><div id="notice" role="status"></div><main id="content"></main><aside id="dock" aria-label="Ассистент"></aside></div>
<dialog id="editor"><form id="edit-form"><div class="form-head"><h2 id="form-title"></h2><button type="button" id="cancel" class="icon" aria-label="Закрыть">×</button></div><div id="fields"></div><button type="submit" class="primary">Сохранить</button></form></dialog>
<dialog id="layout-editor" aria-label="Настроить главный экран"><div class="form-head"><h2>Виджеты</h2><button class="icon" data-close-layout aria-label="Закрыть">×</button></div><p class="subtle">Перетаскивай карточки или меняй порядок стрелками. Скрытие не удаляет данные.</p><div id="layout-items"></div><div class="toolbar"><button class="secondary" data-reset-layout>По умолчанию</button><button class="primary" data-save-layout>Сохранить</button></div></dialog>
<dialog id="archive-preview" class="preview-sheet" aria-label="Просмотр сохранённого"><div class="form-head"><h2 id="preview-title">Просмотр</h2><button class="icon" data-preview-close aria-label="Закрыть">×</button></div><div id="preview-body"></div></dialog>
<link rel="stylesheet" href="/app/assets/mobile.css?v=__NOEMA_APP_BUILD_ID__"><link rel="stylesheet" href="/app/assets/refinement.css?v=__NOEMA_APP_BUILD_ID__"><link rel="stylesheet" href="/app/assets/design-match.css?v=__NOEMA_APP_BUILD_ID__"></body></html>
