<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Noema design recovery comparisons</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font:14px/1.4 Arial,sans-serif}.comparison{width:1190px;height:888px;margin:0;padding:16px;background:#080808;overflow:hidden}.comparison h1{height:28px;margin:0 0 10px;font-size:17px;font-weight:400;letter-spacing:.08em;text-transform:uppercase}.columns{display:grid;grid-template-columns:repeat(3,382px);gap:6px}.column{height:818px;overflow:hidden;border:1px solid #2d2d2d;background:#0a0a0a}.column h2{height:30px;margin:0;padding:7px 10px;border-bottom:1px solid #2d2d2d;color:#aaa;font-size:12px;font-weight:400;letter-spacing:.08em;text-transform:uppercase}.frame{height:786px;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;background:#0a0a0a}.frame img{display:block;width:364px;height:auto;object-fit:contain;object-position:top center}.reference img{max-height:786px}.capture img{width:364px}
  </style>
</head>
<body>
  <section class="comparison" id="home"><h1>Home</h1><div class="columns"><div class="column reference"><h2>Reference</h2><div class="frame"><img src="reference/home.png" alt="Home reference"></div></div><div class="column capture"><h2>Before 4388a2b</h2><div class="frame"><img src="before-4388a2b/home.png" alt="Home before"></div></div><div class="column capture"><h2>Corrected</h2><div class="frame"><img src="corrected/home.png" alt="Home corrected"></div></div></div></section>
  <section class="comparison" id="chat"><h1>Chat</h1><div class="columns"><div class="column reference"><h2>Reference</h2><div class="frame"><img src="reference/chat.png" alt="Chat reference"></div></div><div class="column capture"><h2>Before 4388a2b</h2><div class="frame"><img src="before-4388a2b/chat.png" alt="Chat before"></div></div><div class="column capture"><h2>Corrected</h2><div class="frame"><img src="corrected/chat.png" alt="Chat corrected"></div></div></div></section>
  <section class="comparison" id="tasks"><h1>Tasks</h1><div class="columns"><div class="column reference"><h2>Reference</h2><div class="frame"><img src="reference/tasks.png" alt="Tasks reference"></div></div><div class="column capture"><h2>Before 4388a2b</h2><div class="frame"><img src="before-4388a2b/tasks.png" alt="Tasks before"></div></div><div class="column capture"><h2>Corrected</h2><div class="frame"><img src="corrected/tasks.png" alt="Tasks corrected"></div></div></div></section>
  <section class="comparison" id="notes"><h1>Notes</h1><div class="columns"><div class="column reference"><h2>Reference</h2><div class="frame"><img src="reference/notes.png" alt="Notes reference"></div></div><div class="column capture"><h2>Before 4388a2b</h2><div class="frame"><img src="before-4388a2b/notes.png" alt="Notes before"></div></div><div class="column capture"><h2>Corrected</h2><div class="frame"><img src="corrected/notes.png" alt="Notes corrected"></div></div></div></section>
  <section class="comparison" id="archive"><h1>Archive</h1><div class="columns"><div class="column reference"><h2>Reference</h2><div class="frame"><img src="reference/archive.png" alt="Archive reference"></div></div><div class="column capture"><h2>Before 4388a2b</h2><div class="frame"><img src="before-4388a2b/archive.png" alt="Archive before"></div></div><div class="column capture"><h2>Corrected</h2><div class="frame"><img src="corrected/archive.png" alt="Archive corrected"></div></div></div></section>
  <section class="comparison" id="budget"><h1>Budget</h1><div class="columns"><div class="column reference"><h2>Reference</h2><div class="frame"><img src="reference/budget.png" alt="Budget reference"></div></div><div class="column capture"><h2>Before 4388a2b</h2><div class="frame"><img src="before-4388a2b/budget.png" alt="Budget before"></div></div><div class="column capture"><h2>Corrected</h2><div class="frame"><img src="corrected/budget.png" alt="Budget corrected"></div></div></div></section>
</body>
</html>
